[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitpulse"
version = "0.1.0"
description = "AI 开发工作成果助手"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LicenseRef-Proprietary-TBD" }
authors = [
  { name = "GitPulse Contributors" }
]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.0.0",
  "sqlalchemy>=2.0.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
  "rich>=13.0.0",
  "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.8.0",
  "mypy>=1.10.0",
  "build>=1.2.0",
]
standalone = [
  "pyinstaller>=6.0.0",
]

[project.scripts]
gitpulse = "gitpulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gitpulse"]

[tool.hatch.build.targets.wheel.force-include]
"src/gitpulse/prompts" = "gitpulse/prompts"
"src/gitpulse/storage/migrations" = "gitpulse/storage/migrations"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/RELEASE_CHECKLIST.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
