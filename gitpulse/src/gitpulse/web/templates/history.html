{% extends "base.html" %}
{% block title %}工作历史 · GitPulse{% endblock %}
{% block content %}
<section class="page-heading">
  <div>
    <span class="eyebrow">History</span>
    <h1>工作历史</h1>
    <p>按时间查看真实 Git Commit、确认记录和工作日志。</p>
  </div>
  <div class="export-control">
    <select id="history-export-format" aria-label="导出格式">
      <option value="markdown">Markdown</option>
      <option value="json">JSON</option>
      <option value="csv">CSV</option>
    </select>
    <button class="button secondary" id="history-export" type="button">导出</button>
  </div>
</section>

<section class="history-metrics" aria-label="历史统计">
  <div><span>Git Commit</span><strong id="stat-commits">0</strong></div>
  <div><span>确认记录</span><strong id="stat-records">0</strong></div>
  <div><span>工作日志</span><strong id="stat-worklogs">0</strong></div>
  <div><span>投入时长</span><strong id="stat-duration">0h</strong></div>
  <div><span>仓库</span><strong id="stat-repositories">0</strong></div>
  <div><span>标签</span><strong id="stat-tags">0</strong></div>
</section>

<section class="record-surface">
  <form class="filter-bar history-filter" id="history-filters">
    <label>关键词<input name="keyword" type="search" maxlength="200" placeholder="标题或摘要"></label>
    <label>开始日期<input name="date_from" type="date"></label>
    <label>结束日期<input name="date_to" type="date"></label>
    <label>记录类型
      <select name="record_type">
        <option value="">全部记录</option>
        <option value="git_commit">Git Commit</option>
        <option value="commit_record">确认记录</option>
        <option value="worklog">工作日志</option>
      </select>
    </label>
    <label>Commit 类型<input name="commit_type" maxlength="30" placeholder="feat / fix"></label>
    <label>标签<input name="tag" maxlength="50"></label>
    <button class="button ghost" type="submit">筛选</button>
  </form>
  <div class="table-status">
    <strong id="history-total">0 条记录</strong>
    <span id="history-loading">正在读取...</span>
  </div>
  <div class="timeline" id="history-list"></div>
  <div class="empty-state" id="history-empty" hidden>当前范围内没有可显示的工作历史。</div>
  <nav class="pagination" aria-label="历史分页">
    <button class="button ghost" id="history-prev" type="button">上一页</button>
    <span id="history-page">第 1 页</span>
    <button class="button ghost" id="history-next" type="button">下一页</button>
  </nav>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='/js/history.js') }}"></script>{% endblock %}
