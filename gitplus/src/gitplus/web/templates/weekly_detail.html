{% extends "base.html" %}
{% block title %}周报编辑 · gitplus{% endblock %}
{% block content %}
<section class="page-heading weekly-detail-heading">
  <div>
    <a class="back-link" href="/weekly">返回周报列表</a>
    <h1 id="weekly-report-heading">周报编辑</h1>
    <p id="weekly-report-meta">正在读取...</p>
  </div>
  <div class="report-actions">
    <select id="weekly-export-format" aria-label="导出格式">
      <option value="markdown">Markdown</option>
      <option value="text">Text</option>
      <option value="json">JSON</option>
    </select>
    <button class="button secondary" id="weekly-export" type="button">导出</button>
  </div>
</section>

<div class="weekly-editor-layout" data-report-id="{{ report_id }}">
  <main class="weekly-editor-main">
    <section class="editor-toolbar">
      <label>周报标题<input id="weekly-report-title" maxlength="300"></label>
      <div class="status-line">
        <span id="weekly-status" class="report-status">草稿</span>
        <span id="weekly-coverage">来源覆盖率 0%</span>
        <span id="weekly-version">版本 1</span>
      </div>
    </section>
    <div id="weekly-warnings" class="preview-alert" hidden></div>
    <div id="weekly-sections"></div>
    <section class="manual-entry">
      <h2>新增手动工作项</h2>
      <div>
        <input id="manual-item-title" maxlength="500" placeholder="工作项标题">
        <select id="manual-item-section">
          <option value="completed">本周完成</option>
          <option value="debugging">问题与解决</option>
          <option value="testing">测试与质量</option>
          <option value="risks">补充说明</option>
          <option value="next_week">下周计划</option>
        </select>
        <button class="button secondary" id="add-manual-item" type="button">新增</button>
      </div>
      <button class="button ghost" id="restore-item" type="button" disabled>恢复已删除项</button>
    </section>
  </main>
  <aside class="source-panel">
    <h2>来源追踪</h2>
    <div id="weekly-source-detail">选择工作项查看来源。</div>
  </aside>
</div>

<footer class="weekly-save-bar">
  <button class="button ghost danger-action" id="delete-weekly" type="button">删除周报</button>
  <span id="weekly-save-state">未修改</span>
  <div>
    <button class="button ghost" id="reopen-weekly" type="button" hidden>重新打开</button>
    <button class="button secondary" id="save-weekly" type="button">保存草稿</button>
    <button class="button primary" id="confirm-weekly" type="button">确认周报</button>
  </div>
</footer>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='/js/weekly-detail.js') }}"></script>{% endblock %}
